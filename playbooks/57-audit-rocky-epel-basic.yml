---
- name: 57 Audit Rocky Epel Basic
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit EPEL availability
      ansible.builtin.shell: |
        if command -v dnf >/dev/null 2>&1; then dnf repolist --enabled | grep -i epel || true; fi
      args:
        executable: /bin/bash
      register: result_21863
      changed_when: false
      failed_when: false

