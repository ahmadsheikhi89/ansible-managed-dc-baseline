---
- name: Standardize required internal hosts entries
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  tasks:
    - name: Ensure AtlasForge internal service entries exist
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ATLASFORGE BASELINE MANAGED BLOCK"
        block: |
          10.44.30.31 registry.atlasforge.example
          10.44.30.11 git.atlasforge.example
          10.44.30.13 nexus.atlasforge.example
          10.44.10.10 ntp01.atlasforge.example
        owner: root
        group: root
        mode: '0644'
