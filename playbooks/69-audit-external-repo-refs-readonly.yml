---
- name: 69 Audit External Repo Refs Readonly
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit external repo references
      ansible.builtin.shell: |
        grep -RIE "mirrorlist=|metalink=|download.docker.com|archive.ubuntu.com|security.ubuntu.com" /etc/yum.repos.d /etc/apt 2>/dev/null || true
      args:
        executable: /bin/bash
      register: result_25453
      changed_when: false
      failed_when: false

