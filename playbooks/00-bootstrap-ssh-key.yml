---
- name: Example bootstrap for Ansible SSH key distribution
  hosts: baseline_readonly_scope
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: Ensure ansible_ops account exists
      ansible.builtin.user:
        name: ansible_ops
        shell: /bin/bash
        create_home: true
      when: bootstrap_create_user | default(false) | bool

    - name: Install Ansible public key for ansible_ops
      ansible.posix.authorized_key:
        user: ansible_ops
        state: present
        key: "{{ bootstrap_public_key }}"
      when:
        - bootstrap_install_key | default(false) | bool
        - bootstrap_public_key is defined
