---
- name: Classify managed operating systems
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  tasks:
    - name: Classify host operating system
      ansible.builtin.set_fact:
        baseline_os_class: >-
          {{ 'rocky_managed' if ansible_distribution == 'Rocky' else
             'ubuntu_exception' if ansible_distribution == 'Ubuntu' else
             'unsupported_linux' }}

    - name: Print OS classification
      ansible.builtin.debug:
        msg:
          inventory_hostname: "{{ inventory_hostname }}"
          ansible_host: "{{ ansible_host | default('unknown') }}"
          distribution: "{{ ansible_distribution }}"
          version: "{{ ansible_distribution_version }}"
          baseline_os_class: "{{ baseline_os_class }}"
