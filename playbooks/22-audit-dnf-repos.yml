---
- name: 22 Audit Dnf Repos
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit DNF repository configuration
      ansible.builtin.shell: |
        if command -v dnf >/dev/null 2>&1; then dnf repolist --enabled; fi
      args:
        executable: /bin/bash
      register: result_21791
      changed_when: false
      failed_when: false

