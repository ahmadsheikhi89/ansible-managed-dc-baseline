---
- name: Audit Ubuntu APT sources without update
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  vars:
    report_dir: "{{ playbook_dir }/../reports }"
  tasks:
    - name: Execute read-only command
      ansible.builtin.shell: |
        set -o pipefail
        find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -maxdepth 5 -print -exec sed -n '1,160p' {} \; || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: audit_result

    - name: Show read-only result
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          rc: "{{ audit_result.rc }}"
          stdout: "{{ audit_result.stdout | default('') }}"
          stderr: "{{ audit_result.stderr | default('') }}"
