---
- name: 24 Audit Ubuntu Apt No Update
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit Ubuntu APT sources without update
      ansible.builtin.shell: |
        if command -v apt-cache >/dev/null 2>&1; then grep -R "^deb" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true; fi
      args:
        executable: /bin/bash
      register: result_93194
      changed_when: false
      failed_when: false

