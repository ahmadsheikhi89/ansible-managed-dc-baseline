---
- name: Build final managed datacenter baseline read-only CSV
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  vars:
    report_file: "{{ playbook_dir }}/../reports/final/99-managed-dc-baseline-readonly.csv"
  pre_tasks:
    - name: Create final baseline header
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        content: "inventory_hostname|ansible_host|service_name|real_hostname|os|version|scope|hub_hosts_entry|git_hosts_entry|package_manager|external_repo_refs|time_service|time_sync|chrony_source|selinux|firewalld|firewall_control|docker|final_status|notes
"
        mode: '0644'
      delegate_to: localhost
      run_once: true
      become: false
  tasks:
    - name: Validate required hosts entries
      ansible.builtin.shell: |
        set -o pipefail
        grep -q "registry.atlasforge.example" /etc/hosts && echo yes || echo no
        grep -q "git.atlasforge.example" /etc/hosts && echo yes || echo no
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: hosts_entries

    - name: Check external repository references
      ansible.builtin.shell: |
        set -o pipefail
        grep -RIE "https?://|mirrorlist|metalink" /etc/yum.repos.d /etc/apt 2>/dev/null | grep -v "atlasforge.example" | wc -l
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: repo_refs

    - name: Check core services
      ansible.builtin.shell: |
        set -o pipefail
        printf "docker="; systemctl is-active docker 2>/dev/null || true
        printf "firewalld="; systemctl is-active firewalld 2>/dev/null || true
        printf "selinux="; getenforce 2>/dev/null || echo NotApplicable
        printf "timesync="; timedatectl show -p NTPSynchronized --value 2>/dev/null || echo unknown
        printf "chrony="; chronyc -n sources 2>/dev/null | awk '/\^\*/ {print $2; exit}' || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: service_state

    - name: Build final row facts
      ansible.builtin.set_fact:
        final_hub_hosts_entry: "{{ hosts_entries.stdout_lines[0] | default('no') }}"
        final_git_hosts_entry: "{{ hosts_entries.stdout_lines[1] | default('no') }}"
        final_package_manager: "{{ 'dnf' if ansible_distribution == 'Rocky' else 'apt' if ansible_distribution == 'Ubuntu' else 'unknown' }}"
        final_firewall_control: >-
          {{ 'ACCEPTED_EXCEPTION' if inventory_hostname in baseline_controls.exception_firewalld_hosts else
             'UBUNTU_EXCEPTION' if ansible_distribution == 'Ubuntu' else
             'OK' }}

    - name: Append final baseline row
      ansible.builtin.lineinfile:
        path: "{{ report_file }}"
        line: "{{ inventory_hostname }}|{{ ansible_host | default('unknown') }}|{{ service_name | default('unknown') }}|{{ real_hostname | default(inventory_hostname) }}|{{ ansible_distribution }}|{{ ansible_distribution_version }}|{{ baseline_scope | default('Managed') }}|{{ final_hub_hosts_entry }}|{{ final_git_hosts_entry }}|{{ final_package_manager }}|{{ repo_refs.stdout | trim }}|chronyd|{{ 'yes' if 'timesync=yes' in service_state.stdout else 'unknown' }}|{{ atlasforge.ntp_source }}|{{ 'Enforcing' if ansible_distribution == 'Rocky' else 'NotApplicable' }}|{{ 'exception' if final_firewall_control != 'OK' else 'active' }}|{{ final_firewall_control }}|active|OK|Live read-only baseline row generated by Ansible"
        insertafter: EOF
      delegate_to: localhost
      become: false
      changed_when: false
