---
- name: 20 Fleet Readonly Report
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Collect identity and runtime facts
      ansible.builtin.shell: |
        hostnamectl || true
ip -brief address || true
df -hT || true
      args:
        executable: /bin/bash
      register: result_84073
      changed_when: false
      failed_when: false

