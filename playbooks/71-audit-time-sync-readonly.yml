---
- name: 71 Audit Time Sync Readonly
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit time synchronization
      ansible.builtin.shell: |
        timedatectl status || true
      args:
        executable: /bin/bash
      register: result_70089
      changed_when: false
      failed_when: false

