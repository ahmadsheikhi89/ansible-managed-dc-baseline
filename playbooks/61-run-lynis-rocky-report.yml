---
- name: Run Lynis on Rocky Linux and collect summary evidence
  hosts: rocky_managed
  gather_facts: true
  become: true
  serial: 1
  vars:
    report_file: "{{ playbook_dir }}/../reports/61-lynis-rocky-summary.csv"
  pre_tasks:
    - name: Create Lynis summary header on localhost
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        content: "inventory_hostname|ansible_host|service_name|real_hostname|os|version|hardening_index|tests_done|warnings|suggestions|status|notes
"
        mode: '0644'
      delegate_to: localhost
      run_once: true
      become: false
  tasks:
    - name: Run Lynis audit in non-interactive mode
      ansible.builtin.shell: |
        set -o pipefail
        lynis audit system --quick --no-colors || true
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: lynis_run

    - name: Append conservative Lynis evidence row
      ansible.builtin.lineinfile:
        path: "{{ report_file }}"
        line: "{{ inventory_hostname }}|{{ ansible_host | default('unknown') }}|{{ service_name | default('unknown') }}|{{ real_hostname | default(inventory_hostname) }}|{{ ansible_distribution }}|{{ ansible_distribution_version }}|N/A|N/A|N/A|N/A|OK|Live Lynis run completed; parse /var/log/lynis-report.dat for production scoring"
        insertafter: EOF
      delegate_to: localhost
      become: false
      changed_when: false
