---
- name: 61 Run Lynis Rocky Report
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Run Lynis audit when available
      ansible.builtin.shell: |
        if command -v lynis >/dev/null 2>&1; then lynis audit system --quick --no-colors; else echo "lynis not installed"; fi
      args:
        executable: /bin/bash
      register: result_19047
      changed_when: false
      failed_when: false

