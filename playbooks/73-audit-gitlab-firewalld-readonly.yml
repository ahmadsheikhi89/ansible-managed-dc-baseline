---
- name: 73 Audit Gitlab Firewalld Readonly
  hosts: baseline_readonly_scope
  gather_facts: true
  become: true
  serial: 1
  tasks:

    - name: Audit firewalld and Docker states
      ansible.builtin.shell: |
        systemctl is-active firewalld || true
systemctl is-active docker || true
firewall-cmd --state || true
      args:
        executable: /bin/bash
      register: result_15774
      changed_when: false
      failed_when: false

