  management_cidr: 10.44.10.0/24
  application_cidr: 10.44.20.0/24
  platform_cidr: 10.44.30.0/24
  observability_cidr: 10.44.40.0/24

baseline_controls:
  hosts_file:
    required_entries:
      - { ip: "10.44.30.31", name: "registry.atlasforge.example" }
      - { ip: "10.44.30.11", name: "git.atlasforge.example" }
      - { ip: "10.44.30.13", name: "nexus.atlasforge.example" }
